services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kaeng
      POSTGRES_PASSWORD: kaeng_dev_password
      POSTGRES_DB: kaeng
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaeng -d kaeng"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880" # HTTP/WebSocket signaling
      - "7881:7881" # TCP fallback for WebRTC media
      - "7882:7882/udp" # UDP for WebRTC media

volumes:
  postgres_data:
  redis_data:
