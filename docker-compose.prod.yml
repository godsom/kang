services:
  postgres:
    environment:
      POSTGRES_USER: kaeng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kaeng
    ports: !reset []

  redis:
    ports: !reset []

  livekit:
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command: --bind 0.0.0.0

  migrate:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kaeng:${POSTGRES_PASSWORD}@postgres:5432/kaeng
    command: node scripts/migrate.js
    restart: "no"

  game-server:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3001
      DATABASE_URL: postgres://kaeng:${POSTGRES_PASSWORD}@postgres:5432/kaeng
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    command: node src/server/index.js
    ports:
      - "3001:3001"
    restart: unless-stopped

  auth-server:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      AUTH_PORT: 4000
      DATABASE_URL: postgres://kaeng:${POSTGRES_PASSWORD}@postgres:5432/kaeng
      JWT_SECRET: ${JWT_SECRET}
    command: node src/auth/index.js
    ports:
      - "4000:4000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_AUTH_URL: ${PUBLIC_URL}:4000
        VITE_GAME_SERVER_URL: ${PUBLIC_URL}:3001
    depends_on:
      - game-server
      - auth-server
    ports:
      - "80:80"
    restart: unless-stopped
